global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'bolt'
    static_configs:
      - targets: ['host.docker.internal:7336']
        labels:
          network: 'testnet'
          
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']