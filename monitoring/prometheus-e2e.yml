global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # bootstrap node
  - job_name: 'bolt-bootstrap'
    static_configs:
      - targets: ['bootstrap:9464']
        labels:
          node_type: 'bootstrap'
          node_id: 'bootstrap'
          
  # miner nodes
  - job_name: 'bolt-miners'
    static_configs:
      - targets: ['miner1:9464']
        labels:
          node_type: 'miner'
          node_id: 'miner1'
      - targets: ['miner2:9464']
        labels:
          node_type: 'miner'
          node_id: 'miner2'
          
  # full node
  - job_name: 'bolt-fullnode'
    static_configs:
      - targets: ['fullnode:9464']
        labels:
          node_type: 'full'
          node_id: 'fullnode'
          
  # redis exporter (optional)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          
  # prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']