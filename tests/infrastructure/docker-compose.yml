version: '3.8'

# comprehensive test infrastructure for all services
# use profiles to selectively enable services

services:
  # storage backends
  redis:
    image: redis:7-alpine
    container_name: bolt-test-redis
    ports:
      - "7337:6379"
    profiles: ["redis", "storage", "all"]
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - bolt-test

  postgres:
    image: postgres:15-alpine
    container_name: bolt-test-postgres
    ports:
      - "5433:5432"
    profiles: ["postgres", "storage", "all"]
    environment:
      POSTGRES_USER: bolt
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: bolt_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolt -d bolt_test"]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - bolt-test

  # future: leveldb would be embedded, not a container

  # networking services
  ipfs:
    image: ipfs/kubo:latest
    container_name: bolt-test-ipfs
    ports:
      - "5001:5001"  # api
      - "8080:8080"  # gateway
      - "4001:4001"  # swarm
    profiles: ["ipfs", "network", "all"]
    environment:
      IPFS_PROFILE: test
    healthcheck:
      test: ["CMD-SHELL", "ipfs id"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - bolt-test

  # monitoring services for integration tests
  prometheus:
    image: prom/prometheus:latest
    container_name: bolt-test-prometheus
    ports:
      - "9091:9090"
    profiles: ["monitoring", "all"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1h'
    volumes:
      - ./configs/prometheus.test.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 2s
      timeout: 1s
      retries: 10
    networks:
      - bolt-test

  grafana:
    image: grafana/grafana:latest
    container_name: bolt-test-grafana
    ports:
      - "3001:3000"
    profiles: ["monitoring", "all"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 1s
      retries: 10
    networks:
      - bolt-test

networks:
  bolt-test:
    driver: bridge