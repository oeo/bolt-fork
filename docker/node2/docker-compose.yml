services:
  # Redis for node2
  node2-redis:
    image: redis:7-alpine
    container_name: bolt-node2-redis
    ports:
      - "6389:6379"  # different external port to avoid conflicts
    volumes:
      - node2-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - bolt-node2-network
    restart: unless-stopped

  # IPFS for node2
  node2-ipfs:
    image: ipfs/kubo:latest
    container_name: bolt-node2-ipfs
    environment:
      - IPFS_PROFILE=server
    ports:
      - "4011:4001"     # Swarm port
      - "5011:5001"     # API port
      - "8090:8080"     # Gateway port
    volumes:
      - node2-ipfs-data:/data/ipfs
    networks:
      - bolt-node2-network
      - bolt-shared-network  # for inter-node IPFS communication
    restart: unless-stopped

  # bolt node2
  node2:
    build: 
      context: ../../
      dockerfile: Dockerfile
    container_name: bolt-node2
    environment:
      NODE_ID: node2
      NODE_HOST: bolt-node2
      NODE_ROLE: miner
      API_PORT: 7333
      REDIS_URL: redis://node2-redis:6379
      MINING_ENABLED: "true"
      MINER_ADDRESS: "1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2"
      MINING_MAX_ITERATIONS: "1000000"
      MINING_INTERVAL: "10000"
      ENABLE_IPFS: "true"
      IPFS_API_URL: "http://node2-ipfs:5001"
      LOG_LEVEL: info
    ports:
      - "7343:7333"  # API - different external port
    volumes:
      - node2-data:/data
      - ../../src:/app/src  # for development
    depends_on:
      - node2-redis
      - node2-ipfs
    networks:
      - bolt-node2-network
      - bolt-shared-network  # for inter-node communication
    restart: unless-stopped

volumes:
  node2-redis-data:
  node2-ipfs-data:
  node2-data:

networks:
  bolt-node2-network:
    driver: bridge
  bolt-shared-network:
    external: true  # shared network for inter-node communication