# redis storage service

services:
  redis:
    image: redis:7-alpine
    container_name: ${NODE_NAME:-bolt}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 5
    networks:
      - bolt-network

volumes:
  redis-data: