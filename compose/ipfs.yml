# ipfs networking service

services:
  ipfs:
    image: ipfs/kubo:v0.43.0@sha256:63f5502f7a01b82a675e45bae81b2f5dfa90248ec4a86cd0a58c218347e1f2d2
    container_name: ${NODE_NAME:-bolt}-ipfs
    command: ["daemon", "--migrate=true", "--agent-version-suffix=docker"]
    configs:
      - source: enable-ipfs-pubsub
        target: /container-init.d/001-enable-pubsub.sh
        mode: 0555
    ports:
      - "${IPFS_SWARM_PORT:-4001}:4001"
    volumes:
      - ipfs-data:/data/ipfs
    environment:
      IPFS_PROFILE: ${IPFS_PROFILE:-server}
    healthcheck:
      test: ["CMD-SHELL", "ipfs id"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - bolt-network

volumes:
  ipfs-data:

configs:
  enable-ipfs-pubsub:
    file: ./enable-ipfs-pubsub.sh
