# single node stack with all dependencies
# usage: docker compose -f compose/node.yml up

include:
  - redis.yml
  - ipfs.yml
  - prometheus.yml
  - grafana.yml
  - loki.yml
  - promtail.yml

services:
  bolt:
    extends:
      file: base.yml
      service: node
    container_name: ${NODE_NAME:-bolt-node}
    environment:
      NODE_ID: ${NODE_NAME:-bolt-node}
      NODE_HOST: ${NODE_NAME:-bolt-node}
      REDIS_URL: redis://${NODE_NAME:-bolt-node}-redis:6379
      MINING_ENABLED: ${MINING_ENABLED:-true}
      MINER_ADDRESS: ${MINER_ADDRESS:-1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa}
      MINING_MAX_ITERATIONS: ${MINING_MAX_ITERATIONS:-1000000}
      MINING_INTERVAL: ${MINING_INTERVAL:-10000}
      ENABLE_IPFS: ${ENABLE_IPFS:-true}
    ports:
      - "${API_PORT:-7333}:7333"
      - "${METRICS_PORT:-7336}:7336"
    volumes:
      - bolt-data:/data
      - ../logs:/app/logs
      - ../src:/app/src:ro
    depends_on:
      redis:
        condition: service_healthy
      ipfs:
        condition: service_healthy

volumes:
  bolt-data:
    name: ${NODE_NAME:-bolt-node}-data

networks:
  bolt-network:
    name: ${NETWORK_NAME:-bolt-network}
    external: true