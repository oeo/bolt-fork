# base node service template
# extends this template in composition files

services:
  node:
    image: bolt-node:latest
    build: 
      context: ..
      dockerfile: Dockerfile
    environment:
      BOLT_NETWORK: ${BOLT_NETWORK:-testnet}
      API_PORT: 7333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      ENABLE_IPFS: ${ENABLE_IPFS:-false}
    volumes:
      - ../logs:/app/logs
      - ../src:/app/src:ro
    networks:
      - bolt-network
    restart: unless-stopped