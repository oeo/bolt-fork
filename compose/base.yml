# base node service template
# extends this template in composition files

services:
  node:
    build: 
      context: ..
      dockerfile: Dockerfile
    environment:
      BOLT_NETWORK: ${BOLT_NETWORK:-testnet}
      API_PORT: 7333
      API_HOST: 0.0.0.0
      METRICS_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
    volumes:
      - ../logs:/app/logs
    networks:
      - bolt-network
    restart: unless-stopped
