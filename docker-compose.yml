# main bolt stack - single node with all services
# usage: docker compose up

include:
  # Don't include base.yml - it's only for extending
  - compose/ipfs.yml
  - compose/prometheus.yml
  - compose/grafana.yml
  - compose/loki.yml
  - compose/promtail.yml

services:
  bolt:
    extends:
      file: compose/base.yml
      service: node
    container_name: bolt-node
    env_file:
      - .env
    environment:
      NODE_ID: ${NODE_ID:-primary}
      NODE_HOST: ${NODE_HOST:-bolt-node}
      BOLT_NETWORK: ${BOLT_NETWORK:-testnet}
      API_PORT: ${API_PORT:-7333}
      STORAGE_TYPE: lmdb
      DATA_DIR: /data
      MINING_ENABLED: ${MINING_ENABLED:-true}
      MINER_ADDRESS: ${MINER_ADDRESS:-1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa}
      MINING_MAX_ITERATIONS: ${MINING_MAX_ITERATIONS:-1000000}
      MINING_INTERVAL: ${MINING_INTERVAL:-10000}
      ENABLE_IPFS: ${ENABLE_IPFS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
    ports:
      - "7333:7333"  # API
      - "7336:7336"  # Metrics
    volumes:
      - bolt-data:/data
      - ./logs:/app/logs
      - ./src:/app/src  # for development
    depends_on:
      ipfs:
        condition: service_healthy
    networks:
      - bolt-network
    restart: unless-stopped

volumes:
  bolt-data:

networks:
  bolt-network:
    name: bolt-network
    driver: bridge
