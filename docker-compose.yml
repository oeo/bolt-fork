# main bolt stack - single node with all services
# usage: docker compose up

include:
  # Don't include base.yml - it's only for extending
  - compose/ipfs.yml
  - compose/prometheus.yml
  - compose/grafana.yml

services:
  bolt:
    extends:
      file: compose/base.yml
      service: node
    container_name: bolt-node
    environment:
      NODE_ROLE: ${NODE_ROLE:-full}
      NODE_HOST: ${NODE_HOST:-bolt-node}
      BOLT_NETWORK: ${BOLT_NETWORK:-testnet}
      NETWORK_MODE: ${NETWORK_MODE:-tcp}
      TCP_PORT: ${TCP_PORT:-8333}
      API_PORT: 7333
      API_HOST: 0.0.0.0
      METRICS_PORT: 7336
      METRICS_HOST: 0.0.0.0
      STORAGE_TYPE: lmdb
      DATA_DIR: /data
      MINING_ENABLED: ${MINING_ENABLED:-false}
      MINER_ADDRESS: ${MINER_ADDRESS:-}
      MINING_MAX_ITERATIONS: ${MINING_MAX_ITERATIONS:-1000000}
      MINING_INTERVAL: ${MINING_INTERVAL:-10000}
      IPFS_API: http://ipfs:5001
      IPFS_BOOTSTRAP_ENABLED: ${IPFS_BOOTSTRAP_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
    ports:
      - "${TCP_PORT:-8333}:${TCP_PORT:-8333}"
      - "127.0.0.1:${API_PORT:-7333}:7333"
      - "127.0.0.1:${METRICS_PORT:-7336}:7336"
    volumes:
      - bolt-data:/data
      - ./logs:/app/logs
    depends_on:
      ipfs:
        condition: service_healthy
    networks:
      - bolt-network
    restart: unless-stopped

volumes:
  bolt-data:

networks:
  bolt-network:
    name: bolt-network
    driver: bridge
