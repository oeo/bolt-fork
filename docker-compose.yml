services:
  # shared redis for all nodes
  redis:
    image: redis:7-alpine
    container_name: bolt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - bolt-network
    restart: unless-stopped

  # node 1 - bootstrap/miner
  node1:
    build: .
    container_name: bolt-node1
    environment:
      NODE_ID: node1
      NODE_HOST: bolt-node1
      NODE_ROLE: miner
      API_PORT: 7333
      REDIS_URL: redis://redis:6379
      MINING_ENABLED: "true"
      MINER_ADDRESS: "1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa"
      MINING_MAX_ITERATIONS: "1000000"
      MINING_INTERVAL: "10000"
      ENABLE_IPFS: "true"
      LOG_LEVEL: info
    ports:
      - "7333:7333"  # API
      - "5001:5001"  # IPFS API
      - "4001:4001"  # IPFS Swarm
    volumes:
      - node1-data:/data
      - node1-ipfs:/ipfs
      - ./src:/app/src  # for development
    depends_on:
      - redis
    networks:
      - bolt-network

  # node 2 - miner  
  node2:
    build: .
    container_name: bolt-node2
    environment:
      NODE_ID: node2
      NODE_HOST: bolt-node2
      NODE_ROLE: miner
      API_PORT: 7333
      REDIS_URL: redis://redis:6379
      MINING_ENABLED: "true"
      MINER_ADDRESS: "1BvBMSEYstWetqTFn5Au4m4GFg7xJaNVN2"
      MINING_MAX_ITERATIONS: "1000000"
      MINING_INTERVAL: "10000"
      ENABLE_IPFS: "true"
      LOG_LEVEL: info
    ports:
      - "7343:7333"  # API
      - "5011:5001"  # IPFS API
      - "4011:4001"  # IPFS Swarm
    volumes:
      - node2-data:/data
      - node2-ipfs:/ipfs
      - ./src:/app/src
    depends_on:
      - redis
      - node1
    networks:
      - bolt-network

  # node 3 - full node (non-mining)
  node3:
    build: .
    container_name: bolt-node3
    environment:
      NODE_ID: node3
      NODE_HOST: bolt-node3
      NODE_ROLE: full
      API_PORT: 7333
      REDIS_URL: redis://redis:6379
      ENABLE_IPFS: "true"
      LOG_LEVEL: info
    ports:
      - "7353:7333"  # API
      - "5021:5001"  # IPFS API
      - "4021:4001"  # IPFS Swarm
    volumes:
      - node3-data:/data
      - node3-ipfs:/ipfs
      - ./src:/app/src
    depends_on:
      - redis
      - node1
    networks:
      - bolt-network

volumes:
  redis-data:
  node1-data:
  node1-ipfs:
  node2-data:
  node2-ipfs:
  node3-data:
  node3-ipfs:

networks:
  bolt-network:
    driver: bridge